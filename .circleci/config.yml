version: 2.1

jobs:
  test-redundant-cancellation:
    docker:
      - image: cimg/base:stable
    resource_class: small.gen2
    steps:
      - checkout
      - run:
          name: Install CircleCI CLI
          command: curl -fsSL https://raw.githubusercontent.com/CircleCI-Public/circleci-cli/main/install.sh | sudo bash
      - run:
          name: Cancel redundant workflows
          background: true
          command: |
            set -eu
            project="gh/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            while true; do
              newest=$(circleci run list \
                --project "$project" \
                --branch "$CIRCLE_BRANCH" \
                --limit 5 \
                --json --jq '.[0].id')
              if [ "$newest" != "$CIRCLE_PIPELINE_ID" ]; then
                echo "Newer run $newest found; cancelling this workflow $CIRCLE_WORKFLOW_ID"
                circleci workflow cancel "$CIRCLE_WORKFLOW_ID" --force
                exit 0
              fi
              echo "This run is newest; checking again shortly"
              sleep 8
            done
      - run:
          name: Keep workflow running so overlap can be tested
          command: sleep 300

workflows:
  main:
    jobs:
      - test-redundant-cancellation
